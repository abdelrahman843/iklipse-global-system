name: Deploy to GitHub Pages

# Build the Vite SPA and publish `dist/` to the `gh-pages` environment.
# Secrets required (Settings → Secrets and variables → Actions → New repository secret):
#   VITE_SUPABASE_URL       — https://<project>.supabase.co
#   VITE_SUPABASE_ANON_KEY  — the publishable / anon key
# Both values are shipped to the browser, so it's fine to expose them; the
# database is protected by RLS. Don't commit the service_role key.

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"

      - name: Install
        run: npm ci

      - name: Build
        env:
          VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
          VITE_SUPABASE_ANON_KEY: ${{ secrets.VITE_SUPABASE_ANON_KEY }}
        run: npm run build

      - name: Ship a 404 fallback
        # HashRouter handles refreshes for internal routes, but a hard-typed
        # `.../iklipse-global-system/some-path` should still land on the SPA.
        # Duplicating index.html as 404.html covers that.
        run: cp dist/index.html dist/404.html

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
