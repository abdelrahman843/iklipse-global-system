# iklipse for Android (android/): the web app in the app, with Ikli's calls
# ringing like real ones and every notification through Firebase. Builds a
# signed APK and puts it in iklipse's private "apps" storage, where signed-in
# team members download it (Alerts > Apps) and the app finds its updates
# (apps function, 0072).
#
# Secrets: GOOGLE_SERVICES_JSON_B64 (Firebase's google-services.json, base64),
# ANDROID_KEYSTORE_B64 (the signing key, a .p12, base64), ANDROID_KEYSTORE_PASSWORD,
# APPS_UPLOAD_SECRET. Keep the same key: phones only take updates signed with it.

name: Android app

on:
  push:
    branches: [main]
    paths: ["android/**", ".github/workflows/android.yml"]
  workflow_dispatch:

concurrency:
  group: android
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.11.1"

      - name: Firebase and signing
        env:
          GOOGLE_SERVICES_JSON_B64: ${{ secrets.GOOGLE_SERVICES_JSON_B64 }}
          ANDROID_KEYSTORE_B64: ${{ secrets.ANDROID_KEYSTORE_B64 }}
        run: |
          echo "$GOOGLE_SERVICES_JSON_B64" | base64 -d > android/app/google-services.json
          echo "$ANDROID_KEYSTORE_B64" | base64 -d > "$RUNNER_TEMP/iklipse.p12"

      - name: Build
        working-directory: android
        env:
          VERSION_CODE: ${{ github.run_number }}
          KEYSTORE_FILE: ${{ runner.temp }}/iklipse.p12
          KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
        run: gradle assembleRelease --no-daemon --stacktrace

      - name: Publish
        if: github.ref == 'refs/heads/main'
        env:
          UPLOAD_SECRET: ${{ secrets.APPS_UPLOAD_SECRET }}
          RUN: ${{ github.run_number }}
          API: https://larhrofldblegktowhdw.supabase.co/functions/v1/apps
        run: |
          set -euo pipefail
          FILE="android/iklipse.apk"
          URL=$(curl -sf -X POST "$API/upload" -H "X-Upload-Secret: $UPLOAD_SECRET" -H "Content-Type: application/json" -d "{\"path\":\"$FILE\"}" | jq -r .url)
          curl -sf -X PUT -H "Content-Type: application/vnd.android.package-archive" --data-binary @android/app/build/outputs/apk/release/app-release.apk "$URL" > /dev/null
          curl -sf -X POST "$API/release" -H "X-Upload-Secret: $UPLOAD_SECRET" -H "Content-Type: application/json" \
            -d "{\"platform\":\"android\",\"code\":$RUN,\"name\":\"1.0.$RUN\",\"file\":\"$FILE\"}"
