# iklipse for Mac (mac/): the web app in a window, in the menu bar, with Ikli's
# calls and notifications. Builds the disk image and puts it in iklipse's
# private "apps" storage, where signed-in team members download it (Alerts >
# Apps) and the app finds its updates (apps function, 0072). Any branch builds
# (to check it); only main publishes.
#
# Secret: APPS_UPLOAD_SECRET.

name: Mac app

on:
  push:
    paths: ["mac/**", ".github/workflows/mac.yml"]
  workflow_dispatch:

concurrency:
  group: mac-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - name: Build
        env:
          CODE: ${{ github.run_number }}
        run: bash mac/build.sh

      - name: Publish
        if: github.ref == 'refs/heads/main'
        env:
          UPLOAD_SECRET: ${{ secrets.APPS_UPLOAD_SECRET }}
          RUN: ${{ github.run_number }}
          API: https://larhrofldblegktowhdw.supabase.co/functions/v1/apps
        shell: bash
        run: |
          set -euo pipefail
          FILE="mac/iklipse.dmg"
          URL=$(curl -sf -X POST "$API/upload" -H "X-Upload-Secret: $UPLOAD_SECRET" -H "Content-Type: application/json" -d "{\"path\":\"$FILE\"}" | jq -r .url)
          curl -sf -X PUT -H "Content-Type: application/x-apple-diskimage" --data-binary @mac/out/iklipse.dmg "$URL" > /dev/null
          curl -sf -X POST "$API/release" -H "X-Upload-Secret: $UPLOAD_SECRET" -H "Content-Type: application/json" \
            -d "{\"platform\":\"mac\",\"code\":$RUN,\"name\":\"1.0.$RUN\",\"file\":\"$FILE\"}"
