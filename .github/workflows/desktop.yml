# iklipse for Windows (desktop/): the web app in WebView2, in the tray, with
# Ikli's calls and notifications. Builds the installer and puts it in iklipse's
# private "apps" storage, where signed-in team members download it (Alerts >
# Apps) and the app finds its updates (apps function, 0072).
#
# Secret: APPS_UPLOAD_SECRET.

name: Windows app

on:
  push:
    branches: [main]
    paths: ["desktop/**", ".github/workflows/desktop.yml"]
  workflow_dispatch:

concurrency:
  group: desktop
  cancel-in-progress: false

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Build
        working-directory: desktop
        run: dotnet build Iklipse.csproj -c Release -p:BuildCode=${{ github.run_number }}

      - name: Installer
        working-directory: desktop
        env:
          APP_VERSION: 1.0.${{ github.run_number }}
        shell: pwsh
        run: |
          $iscc = "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe"
          if (-not (Test-Path $iscc)) { choco install innosetup -y --no-progress | Out-Null }
          & $iscc installer.iss
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          Get-Item out\iklipse-setup.exe | Select-Object Name, Length

      - name: Publish
        if: github.ref == 'refs/heads/main'
        env:
          UPLOAD_SECRET: ${{ secrets.APPS_UPLOAD_SECRET }}
          RUN: ${{ github.run_number }}
          API: https://larhrofldblegktowhdw.supabase.co/functions/v1/apps
        shell: bash
        run: |
          set -euo pipefail
          FILE="windows/iklipse-setup.exe"
          URL=$(curl -sf -X POST "$API/upload" -H "X-Upload-Secret: $UPLOAD_SECRET" -H "Content-Type: application/json" -d "{\"path\":\"$FILE\"}" | jq -r .url)
          curl -sf -X PUT -H "Content-Type: application/vnd.microsoft.portable-executable" --data-binary @desktop/out/iklipse-setup.exe "$URL" > /dev/null
          curl -sf -X POST "$API/release" -H "X-Upload-Secret: $UPLOAD_SECRET" -H "Content-Type: application/json" \
            -d "{\"platform\":\"windows\",\"code\":$RUN,\"name\":\"1.0.$RUN\",\"file\":\"$FILE\"}"
