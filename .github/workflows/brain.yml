name: Brain checks

# Type-checks and tests the brain (brain/: Claude on the Agent SDK for the
# team on WhatsApp). Nothing is deployed and no secret is used: Claude and
# the whatsapp-bot function are stand-ins in the tests.

on:
  pull_request:
    paths:
      - "brain/**"
      - ".github/workflows/brain.yml"
  push:
    branches: [main]
    paths:
      - "brain/**"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: brain
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: brain/package-lock.json
      - run: npm ci --ignore-scripts
      - run: npm run check
      - run: npm test
      - run: bash -n deploy/update.sh
