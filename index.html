<!DOCTYPE html>
<html lang="en" data-theme="dark">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#1e232c" />
    <script>
      // Set the theme before first paint so there is no light-mode flash.
      // Saved preference wins; otherwise dark is the default.
      (function () {
        var root = document.documentElement;
        try {
          var t = localStorage.getItem("theme");
          if (t !== "light" && t !== "dark") t = "dark";
          root.setAttribute("data-theme", t);
        } catch (e) {
          root.setAttribute("data-theme", "dark");
        }
        // Mobile browser chrome matches the header surface (--c-surface) and
        // follows every later theme switch.
        var meta = document.querySelector('meta[name="theme-color"]');
        var sync = function () {
          if (meta) meta.setAttribute("content", root.getAttribute("data-theme") === "light" ? "#ffffff" : "#1e232c");
        };
        sync();
        if (window.MutationObserver) new MutationObserver(sync).observe(root, { attributes: true, attributeFilter: ["data-theme"] });
      })();
    </script>
    <!-- Installable app (phone home screen / desktop): manifest, icons, and
         full-screen behaviour once opened from the home screen. -->
    <link rel="manifest" href="%BASE_URL%manifest.webmanifest" />
    <link rel="icon" type="image/svg+xml" href="%BASE_URL%icons/favicon.svg" />
    <link rel="icon" type="image/png" sizes="32x32" href="%BASE_URL%icons/favicon-32.png" />
    <link rel="apple-touch-icon" href="%BASE_URL%icons/apple-touch-icon.png" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-title" content="Iklipse" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="application-name" content="Iklipse" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap"
      rel="stylesheet"
    />
    <title>Iklipse System</title>
    <!-- First-paint loader (until React mounts): the same logo fill as <LogoLoader/>. -->
    <style>
      html[data-theme="dark"] body { background: rgb(15 18 24); color: rgb(237 240 245); }
      html[data-theme="light"] body { background: rgb(234 237 241); color: rgb(11 18 32); }
      .boot { position: fixed; inset: 0; display: grid; place-items: center; animation: boot-in 0.3s 0.15s cubic-bezier(0.22, 1, 0.36, 1) both; }
      .boot svg { width: 132px; height: 61px; overflow: visible; }
      .boot .g { opacity: 0.14; }
      .boot .f { fill: rgb(242 68 44); }
      html[data-theme="light"] .boot .f { fill: rgb(228 43 12); }
      .boot .r { animation: boot-rise 2.4s cubic-bezier(0.45, 0, 0.55, 1) infinite alternate; }
      .boot .a { animation: boot-wave-a 2.6s linear infinite; }
      .boot .b { animation: boot-wave-b 4s linear infinite; }
      @keyframes boot-in { from { opacity: 0; transform: scale(0.94); } to { opacity: 1; transform: none; } }
      @keyframes boot-rise { from { transform: translateY(330px); } to { transform: translateY(-30px); } }
      @keyframes boot-wave-a { to { transform: translateX(-256px); } }
      @keyframes boot-wave-b { to { transform: translateX(192px); } }
      @media (prefers-reduced-motion: reduce) { .boot, .boot .a, .boot .b { animation: none; } .boot .r { animation: none; transform: translateY(150px); } }
    </style>
  </head>
